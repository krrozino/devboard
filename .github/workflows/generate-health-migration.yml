name: Generate Health migration

on:
  push:
    branches: [feat/project-health-engine]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/project-health-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate migration
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://devboard:devboard@localhost:5432/devboard

      - name: Commit generated migration
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain drizzle)" ]; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "chore(db): generate health migration"
          git push
